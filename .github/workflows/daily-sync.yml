name: RedPet Dashboard Daily Sync

on:
  schedule:
    # UTC 03:00 = 北京时间每天 11:00（主）
    - cron: '0 3 * * *'
    # UTC 05:00 = 北京时间每天 13:00（备用：GitHub 偶发延迟/跳过时补跑；数据无变化会自动跳过提交）
    - cron: '0 5 * * *'
  workflow_dispatch:   # 允许在 GitHub 网页手动点一下就跑

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 拉取仓库
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 准备 Node（企微 CLI 需要）
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安装企微 CLI
        run: |
          mkdir -p "$HOME/.config/wecom"
          # 必须装到 sync.py 期望的路径 work/wecom-cli-runtime/node_modules/...
          npm install @wecom/cli --prefix work/wecom-cli-runtime 2>&1 | tail -3
          ls -l work/wecom-cli-runtime/node_modules/@wecom/cli/bin/wecom.js
          echo "WECOM_NODE=$(which node)" >> $GITHUB_ENV

      - name: 恢复企微登录凭证
        env:
          WECOM_CRED: ${{ secrets.WECOM_CREDENTIALS }}
          WECOM_KEY: ${{ secrets.WECOM_ENCRYPTION_KEY }}
        run: |
          printf '%s' "$WECOM_CRED" | base64 -d > "$HOME/.config/wecom/credentials.enc"
          printf '%s' "$WECOM_KEY"  | base64 -d > "$HOME/.config/wecom/.encryption_key"
          chmod 600 "$HOME/.config/wecom/credentials.enc" "$HOME/.config/wecom/.encryption_key"
          ls -l "$HOME/.config/wecom"

      - name: 从企业微信在线表格取数并生成看板数据
        env:
          WECHAT_DOC_ACTIVITY: ${{ secrets.WECHAT_DOC_ACTIVITY }}
          WECHAT_DOC_SIZES: ${{ secrets.WECHAT_DOC_SIZES }}
        run: |
          # 空目录不会被 git 跟踪，这里补建（sync.py 会往里写临时文件）
          mkdir -p work/wecom-sync/input
          # GitHub 服务器在国外访问企微，偶发网络抖动，失败自动重试 3 次
          for i in 1 2 3; do
            echo "===== 第 $i 次尝试 ====="
            if python work/wecom-sync/sync.py wecom; then
              echo "✅ 取数成功"
              exit 0
            fi
            echo "⚠️ 第 $i 次失败，25 秒后重试"
            sleep 25
          done
          echo "❌ 3 次均失败"
          exit 1

      - name: 拷贝到发布目录 docs/
        run: |
          mkdir -p docs
          for f in index.html dashboard-data.json assistant-icon.jpg \
                   icon-32.png icon-180.png icon-192.png icon-512.png manifest.webmanifest; do
            [ -f "dist/$f" ] && cp -f "dist/$f" "docs/$f"
          done
          ls -l docs

      - name: 提交并推送
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet; then
            echo "数据无变化，今日不提交"
          else
            git commit -m "daily sync $(date -u +%F)"
            git push
          fi
